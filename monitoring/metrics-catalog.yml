# Catalog of key omni-stellar-omni-stellar-mainstay metrics.
#
# Every metric the exporter or cost tooling emits should be listed here.
# `retention` names a tier defined in docs/monitoring/METRICS_COLLECTION.md.
# scripts/check_metrics_catalog.sh verifies the catalog stays in sync with
# the code that emits the metrics.

metrics:
  - name: omni-stellar-mainstay_rpc_errors_last_scrape
    type: gauge
    unit: calls
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Failed read-only RPC calls in the latest collection.

  - name: omni-stellar-mainstay_rpc_requests_last_scrape
    type: gauge
    unit: calls
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Read-only RPC calls made in the latest collection.

  - name: omni-stellar-mainstay_rpc_request_duration_seconds_sum
    type: gauge
    unit: seconds
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Total RPC call time in the latest collection (response time = sum / requests).

  - name: omni-stellar-mainstay_assets_total
    type: gauge
    unit: assets
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Total registered assets.

  - name: omni-stellar-mainstay_engineers_total
    type: gauge
    unit: engineers
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Total registered engineers.

  - name: omni-stellar-mainstay_avg_collateral_score
    type: gauge
    unit: score
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Average collateral score across scored assets.

  - name: omni-stellar-mainstay_scored_assets_count
    type: gauge
    unit: assets
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Assets with a non-zero collateral score.

  - name: omni-stellar-mainstay_maintenance_records_total
    type: gauge
    unit: records
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Total maintenance records across all assets.

  - name: omni-stellar-mainstay_collateral_score
    type: gauge
    unit: score
    labels: [asset_id]
    retention: daily
    source: scripts/monitoring/prometheus-exporter.sh
    description: Per-asset collateral score (0-100).

  - name: omni-stellar-mainstay_days_since_last_service
    type: gauge
    unit: days
    labels: [asset_id]
    retention: daily
    source: scripts/monitoring/prometheus-exporter.sh
    description: Days since last service per asset (-1 if never serviced).

  - name: omni-stellar-mainstay_metrics_collection_seconds
    type: gauge
    unit: unix_seconds
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Timestamp of the last successful collection.

  - name: omni-stellar-mainstay_exporter_up
    type: gauge
    unit: boolean
    retention: raw
    source: scripts/monitoring/prometheus-exporter.sh
    description: Exporter liveness (1 = up).
