# Recording rules for omni-stellar-omni-stellar-mainstay key metrics.
# Source metrics are catalogued in monitoring/metrics-catalog.yml.

groups:
  - name: omni-stellar-mainstay-rpc
    rules:
      # Fraction of read-only RPC calls that failed in the latest collection.
      - record: omni-stellar-mainstay:rpc_error_ratio
        expr: |
          omni-stellar-mainstay_rpc_errors_last_scrape
            / clamp_min(omni-stellar-mainstay_rpc_requests_last_scrape, 1)

      # Mean response time of a read-only RPC call in the latest collection.
      - record: omni-stellar-mainstay:rpc_response_time_seconds_avg
        expr: |
          omni-stellar-mainstay_rpc_request_duration_seconds_sum
            / clamp_min(omni-stellar-mainstay_rpc_requests_last_scrape, 1)

  - name: omni-stellar-mainstay-gas
    rules:
      # Gas (stroops) spent per operation, averaged over one hour.
      - record: omni-stellar-mainstay:operation_gas_stroops:rate1h
        expr: |
          sum by (operation) (rate(omni-stellar-mainstay_operation_gas_stroops_total[1h]))

  - name: omni-stellar-mainstay-alerts-support
    rules:
      # Scrape-level health used by the alerting rules in scripts/monitoring.
      - record: omni-stellar-mainstay:exporter_up:avg5m
        expr: avg_over_time(omni-stellar-mainstay_exporter_up[5m])
