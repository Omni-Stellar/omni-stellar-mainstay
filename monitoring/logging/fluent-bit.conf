# Fluent Bit: ship omni-stellar-omni-stellar-mainstay JSONL logs to Loki (#1729).
#
# Every ops tool writes one JSON object per line to MAINSTAY_LOG_FILE, and the
# log directory is mounted at /var/log/omni-stellar-mainstay. Set LOKI_HOST and
# MAINSTAY_ENV in the agent's environment. Parsers are in parsers.conf.

[SERVICE]
    Flush             5
    Log_Level         info
    Parsers_File      parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020

[INPUT]
    Name              tail
    Path              /var/log/omni-stellar-mainstay/*.jsonl
    Tag               omni-stellar-mainstay.*
    Parser            omni-stellar-mainstay_json
    DB                /var/lib/fluent-bit/omni-stellar-mainstay.db
    Refresh_Interval  10
    Read_from_Head    On
    Skip_Long_Lines   On

# Lines that fail the JSON parser are kept, not dropped, so malformed
# records remain searchable.
[FILTER]
    Name              modify
    Match             omni-stellar-mainstay.*
    Add               environment ${MAINSTAY_ENV}

[OUTPUT]
    Name              loki
    Match             omni-stellar-mainstay.*
    Host              ${LOKI_HOST}
    Port              3100
    Labels            job=omni-stellar-mainstay, environment=${MAINSTAY_ENV}, service=$service, level=$level
    Line_Format       json
    Auto_Kubernetes_Labels Off
